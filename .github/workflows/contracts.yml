name: Offline Flutter source consistency
on:
  pull_request:
  push:
    branches: [master]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check assets and persisted sign-in key
        run: python -m unittest discover -s tests -v
